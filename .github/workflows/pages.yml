name: Deploy GitHub Trust Auditor

on:
  push:
    branches: [main]
    paths:
      - 'site.part*'
      - site_patch.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build static site
        run: |
          set -euo pipefail
          mkdir -p _site
          cat site.part01 site.part02 site.part03 site.part04 site.part05 | base64 --decode | gzip --decompress > _site/index.html
          python site_patch.py _site/index.html
          python - <<'PY'
          from pathlib import Path
          import re, base64
          p = Path('_site/index.html')
          s = p.read_text()
          helpers = "const SKIP=/(^|\\/)(node_modules|vendor|dist|build|coverage|\\.next|\\.cache|\\.git|target|\\.venv|venv|__pycache__)(\\/|$)/i;\nconst EXT=/\\.(py|js|mjs|cjs|ts|tsx|jsx|json|yml|yaml|sh|bash|zsh|ps1|bat|cmd|rs|go|java|kt|sol|toml|ini|cfg|conf|env|txt|md|html|htm|xml|rb|php|pl|lua|swift|dart)$/i;\nfunction textCandidate(x){let p=x.path||'',z=+x.size||0;return x.type==='blob'&&z>0&&z<=CFG.maxFileSize&&!SKIP.test(p)&&(EXT.test(p)||/(Dockerfile|Makefile|requirements\\.txt|package-lock\\.json|yarn\\.lock|pnpm-lock\\.yaml)$/i.test(p))}\n"
          if 'const SKIP=' not in s or 'const EXT=' not in s or 'function textCandidate(' not in s:
              needle = 'function lineNo(t,i)'
              if needle not in s:
                  raise SystemExit('Build failed: scanner helper anchor missing')
              s = re.sub(r'function textCandidate\(x\)\{[^\n]*\}\n?', '', s, count=1)
              s = re.sub(r'const SKIP=[^\n]*\n?', '', s, count=1)
              s = re.sub(r'const EXT=[^\n]*\n?', '', s, count=1)
              s = s.replace(needle, helpers + needle, 1)
          metrics = '<div class="metrics"><span><i data-t="security">Security</i><b id="sec">—</b>/60</span><span><i data-t="hygiene">Repo hygiene</i><b id="hyg">—</b>/20</span><span><i data-t="history">History</i><b id="hist">—</b>/12</span><span><i data-t="greens">Green squares</i><b id="green">—</b>/8</span></div>'
          explain = metrics + '<div id="scoreExplain" style="margin-top:16px;padding:16px 18px;border:1px solid #d8e2f0;border-radius:18px;background:#f8fbff;line-height:1.55"></div>'
          if 'id="scoreExplain"' not in s:
              if metrics not in s:
                  raise SystemExit('Build failed: score metrics anchor missing')
              s = s.replace(metrics, explain, 1)
          score_anchor = "$('#green').textContent=r.score.contributions;"
          score_js = base64.b64decode('').decode()
          if 'scoreParts=[' not in s:
              if score_anchor not in s:
                  raise SystemExit('Build failed: render score anchor missing')
              s = s.replace(score_anchor, score_js, 1)

          mobile_css = '''<style id="mobile-layout-fix">
          #results>.card{display:block!important;min-width:0}
          #results .banner,#results .profile,#results .metrics,#results .activity,#results .riskRows,#scoreExplain{min-width:0;max-width:100%}
          #scoreExplain{width:100%;overflow-wrap:anywhere;word-break:normal}
          #results .banner{align-items:flex-start}
          @media(max-width:720px){
            .wrap{padding:14px}
            #results>.card{padding:16px;margin:12px 0}
            #results .banner{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:18px;width:100%}
            #results .banner h2{font-size:25px;line-height:1.08;overflow-wrap:anywhere}
            #results .banner p{line-height:1.5}
            #results .orb{width:74px;height:74px;min-width:74px;border-width:6px;font-size:23px}
            #results .profile{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;width:100%}
            #results .ava{width:62px;height:62px}
            #results .profile h3{font-size:21px;overflow-wrap:anywhere}
            #results .stats{gap:10px 14px}
            #results .metrics,#results .activity{grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
            #results .metrics span,#results .activity span{min-width:0}
            #results .risk{grid-template-columns:minmax(0,1fr) auto;width:100%}
            #scoreExplain{padding:14px!important;font-size:13px}
            #scoreExplain>div:first-child{align-items:flex-start!important;flex-direction:column;gap:4px!important}
            #results .head{width:100%}
            #results .table{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
          }
          </style>'''
          if 'id="mobile-layout-fix"' not in s:
              if '</head>' not in s:
                  raise SystemExit('Build failed: head anchor missing')
              s = s.replace('</head>', mobile_css + '\n</head>', 1)
          p.write_text(s)
          PY
          touch _site/.nojekyll
          test -s _site/index.html
          grep -q 'const SKIP=' _site/index.html
          grep -q 'const EXT=' _site/index.html
          grep -q 'function textCandidate(x)' _site/index.html
          grep -q 'cand=tree.filter(textCandidate)' _site/index.html
          grep -q 'id="scoreExplain"' _site/index.html
          grep -q 'Score breakdown & why points were deducted' _site/index.html
          grep -q 'id="mobile-layout-fix"' _site/index.html
          grep -q '#results>.card{display:block!important' _site/index.html
          grep -q 'WALLET_CLIPBOARD_HIJACK' _site/index.html
          grep -q 'SECRET_TO_EXFIL_ENDPOINT' _site/index.html
          grep -q 'SEVERE SECURITY RISK' _site/index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('_site/index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not scripts: raise SystemExit('Build failed: inline script missing')
          Path('_site/runtime-check.js').write_text('\n'.join(scripts))
          PY
          node --check _site/runtime-check.js
          rm _site/runtime-check.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
