name: Deploy GitHub Trust Auditor

on:
  push:
    branches: [main]
    paths:
      - 'site.part*'
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build static site
        run: |
          mkdir -p _site
          cat site.part01 site.part02 site.part03 site.part04 site.part05 | base64 --decode | gzip --decompress > _site/index.html
          touch _site/.nojekyll
          test -s _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
