name: Deploy GitHub Trust Auditor

on:
  push:
    branches: [main]
    paths:
      - 'site.part*'
      - site_patch.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build static site
        run: |
          set -euo pipefail
          mkdir -p _site
          cat site.part01 site.part02 site.part03 site.part04 site.part05 | base64 --decode | gzip --decompress > _site/index.html
          python site_patch.py _site/index.html

          python - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text()
          helper = "function textCandidate(x){let p=x.path||'',s=+x.size||0;return x.type==='blob'&&s>0&&s<=CFG.maxFileSize&&!SKIP.test(p)&&(EXT.test(p)||/(Dockerfile|Makefile|requirements\\.txt|package-lock\\.json|yarn\\.lock|pnpm-lock\\.yaml)$/i.test(p))}\n"
          if 'function textCandidate(' not in s:
              needle = 'function lineNo(t,i)'
              if needle not in s:
                  raise SystemExit('Build failed: lineNo anchor missing; scanner patch layout changed')
              s = s.replace(needle, helper + needle, 1)
          p.write_text(s)
          PY

          touch _site/.nojekyll
          test -s _site/index.html
          grep -q 'function textCandidate(x)' _site/index.html
          grep -q 'cand=tree.filter(textCandidate)' _site/index.html
          grep -q 'WALLET_CLIPBOARD_HIJACK' _site/index.html
          grep -q 'SECRET_TO_EXFIL_ENDPOINT' _site/index.html
          grep -q 'SEVERE SECURITY RISK' _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
