name: Deploy GitHub Trust Auditor

on:
  push:
    branches: [main]
    paths:
      - 'site.part*'
      - site_patch.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build static site
        run: |
          set -euo pipefail
          mkdir -p _site
          cat site.part01 site.part02 site.part03 site.part04 site.part05 | base64 --decode | gzip --decompress > _site/index.html
          python site_patch.py _site/index.html
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('_site/index.html')
          s = p.read_text()

          helpers = "const SKIP=/(^|\\/)(node_modules|vendor|dist|build|coverage|\\.next|\\.cache|\\.git|target|\\.venv|venv|__pycache__)(\\/|$)/i;\nconst EXT=/\\.(py|js|mjs|cjs|ts|tsx|jsx|json|yml|yaml|sh|bash|zsh|ps1|bat|cmd|rs|go|java|kt|sol|toml|ini|cfg|conf|env|txt|md|html|htm|xml|rb|php|pl|lua|swift|dart)$/i;\nfunction textCandidate(x){let p=x.path||'',z=+x.size||0;return x.type==='blob'&&z>0&&z<=CFG.maxFileSize&&!SKIP.test(p)&&(EXT.test(p)||/(Dockerfile|Makefile|requirements\\.txt|package-lock\\.json|yarn\\.lock|pnpm-lock\\.yaml)$/i.test(p))}\n"
          if 'const SKIP=' not in s or 'const EXT=' not in s or 'function textCandidate(' not in s:
              needle = 'function lineNo(t,i)'
              if needle not in s:
                  raise SystemExit('Build failed: scanner helper anchor missing')
              s = re.sub(r'function textCandidate\(x\)\{[^\n]*\}\n?', '', s, count=1)
              s = re.sub(r'const SKIP=[^\n]*\n?', '', s, count=1)
              s = re.sub(r'const EXT=[^\n]*\n?', '', s, count=1)
              s = s.replace(needle, helpers + needle, 1)

          # Add a transparent score explanation directly below the four score metrics.
          metrics = '<div class="metrics"><span><i data-t="security">Security</i><b id="sec">—</b>/60</span><span><i data-t="hygiene">Repo hygiene</i><b id="hyg">—</b>/20</span><span><i data-t="history">History</i><b id="hist">—</b>/12</span><span><i data-t="greens">Green squares</i><b id="green">—</b>/8</span></div>'
          explain = metrics + '<div id="scoreExplain" style="margin-top:16px;padding:16px 18px;border:1px solid #d8e2f0;border-radius:18px;background:#f8fbff;line-height:1.55"></div>'
          if 'id="scoreExplain"' not in s:
              if metrics not in s:
                  raise SystemExit('Build failed: score metrics anchor missing')
              s = s.replace(metrics, explain, 1)

          score_anchor = "$('#green').textContent=r.score.contributions;"
          score_js = r'''$('#green').textContent=r.score.contributions;
let scoreParts=[
  {en:'Security',fa:'امنیت',got:r.score.security,max:60,whyEn:'security findings in scanned code',whyFa:'یافته‌های امنیتی در کدهای اسکن‌شده'},
  {en:'Repo hygiene',fa:'کیفیت ریپوها',got:r.score.hygiene,max:20,whyEn:'README / License / SECURITY / CI coverage',whyFa:'پوشش README / License / SECURITY / CI'},
  {en:'History',fa:'سابقه',got:r.score.history,max:12,whyEn:'account age, original repos, stars, forks and recent activity',whyFa:'سن اکانت، ریپوهای اصلی، استار، فورک و فعالیت اخیر'},
  {en:'Green squares',fa:'چمن‌های سبز',got:r.score.contributions,max:8,whyEn:'active days, contribution count and streak thresholds',whyFa:'روزهای فعال، تعداد کانتریبیوشن و استریک‌ها'}
];
let earnedRaw=scoreParts.reduce((a,x)=>a+(+x.got||0),0), shown=+r.score.total||0, capLoss=Math.max(0,earnedRaw-shown), missing=Math.max(0,100-shown);
let scoreRows=scoreParts.map(x=>{let lost=Math.max(0,x.max-(+x.got||0));return `<div style="display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #e8eef6"><span><b>${lang==='fa'?x.fa:x.en}</b><small style="display:block;color:#68758a">${lost?((lang==='fa'?`${lost} امتیاز نگرفته — `:`${lost} point${lost===1?'':'s'} not earned — `)+(lang==='fa'?x.whyFa:x.whyEn)):(lang==='fa'?'امتیاز کامل':'Full points')}</small></span><b style="white-space:nowrap">${x.got}/${x.max}</b></div>`}).join('');
let capRow=capLoss?`<div style="padding-top:8px;color:#9b2c2c"><b>${lang==='fa'?`محدودیت ریسک/پوشش: ${capLoss}- امتیاز`:`Risk/coverage cap: -${capLoss} points`}</b></div>`:'';
$('#scoreExplain').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px"><b>${lang==='fa'?'ریز امتیاز و علت کسر':'Score breakdown & why points were deducted'}</b><strong>${lang==='fa'?`${missing} امتیاز تا ۱۰۰`:`${missing} points to 100`}</strong></div>${scoreRows}${capRow}`;'''
          if 'scoreParts=[' not in s:
              if score_anchor not in s:
                  raise SystemExit('Build failed: render score anchor missing')
              s = s.replace(score_anchor, score_js, 1)

          p.write_text(s)
          PY
          touch _site/.nojekyll
          test -s _site/index.html
          grep -q 'const SKIP=' _site/index.html
          grep -q 'const EXT=' _site/index.html
          grep -q 'function textCandidate(x)' _site/index.html
          grep -q 'cand=tree.filter(textCandidate)' _site/index.html
          grep -q 'id="scoreExplain"' _site/index.html
          grep -q 'Score breakdown & why points were deducted' _site/index.html
          grep -q 'WALLET_CLIPBOARD_HIJACK' _site/index.html
          grep -q 'SECRET_TO_EXFIL_ENDPOINT' _site/index.html
          grep -q 'SEVERE SECURITY RISK' _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
