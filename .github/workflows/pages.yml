name: Deploy GitHub Trust Auditor

on:
  push:
    branches: [main]
    paths:
      - 'site.part*'
      - site_patch.py
      - build_site.py
      - post_build_patch.py
      - ux_language_fix.py
      - ux_support_prefill.py
      - overall_score_style.py
      - cache_rate_limit.py
      - engagement_stats.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and validate static site
        run: |
          set -euo pipefail
          python build_site.py
          python post_build_patch.py _site/index.html
          python ux_language_fix.py _site/index.html
          python ux_support_prefill.py _site/index.html
          python overall_score_style.py _site/index.html
          python cache_rate_limit.py _site/index.html
          python engagement_stats.py _site/index.html
          test -s _site/index.html
          grep -q "INCOMPLETE SCAN" _site/index.html
          grep -q "scan_status:'unavailable'" _site/index.html
          grep -q "repositories unavailable for inspection" _site/index.html
          grep -q "informational finding(s); no security-score penalty" _site/index.html
          grep -q 'id="mobile-repo-table-fix"' _site/index.html
          grep -q 'id="langEn"' _site/index.html
          grep -q 'id="langFa"' _site/index.html
          grep -q "document.documentElement.dir='ltr'" _site/index.html
          grep -q 'id="go" class="btn blue" data-t="scan"' _site/index.html
          grep -q 'Star SamAlpha1/GitHubTrustAuditor' _site/index.html
          grep -q 'Fork SamAlpha1/GitHubTrustAuditor' _site/index.html
          grep -q 'scanning is always available below' _site/index.html
          grep -q 'id="visitor"' _site/index.html
          grep -q 'value="SamAlpha1"' _site/index.html
          grep -q 'href="https://github.com/SamAlpha1/GitHubTrustAuditor"' _site/index.html
          grep -q 'href="https://github.com/SamAlpha1/GitHubTrustAuditor/fork"' _site/index.html
          grep -q 'id="overall-score-style"' _site/index.html
          grep -q 'This Account’s Overall Score' _site/index.html
          grep -q 'جمع امتیاز این اکانت' _site/index.html
          grep -q 'overallScoreVisual(r.score.total)' _site/index.html
          grep -q 'GTA_API_CACHE_TTL' _site/index.html
          grep -q 'GTA_AUDIT_CACHE_TTL' _site/index.html
          grep -q 'async function auditNetwork(v)' _site/index.html
          grep -q "mode:'stale-rate-limit'" _site/index.html
          grep -q 'id="engagementStats"' _site/index.html
          grep -q 'id="visitCount"' _site/index.html
          grep -q 'id="starClickCount"' _site/index.html
          grep -q 'id="forkClickCount"' _site/index.html
          grep -q 'counterapi.com/api' _site/index.html
          ! grep -q '<input id="target" disabled' _site/index.html
          ! grep -q 'id="go" class="btn blue" disabled' _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
