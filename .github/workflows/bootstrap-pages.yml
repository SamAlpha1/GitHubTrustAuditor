name: Bootstrap web auditor
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-pages.yml'
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install web application
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/part1.b64 .payload/part2.b64 | base64 -d > /tmp/gta.tar.xz
          xz -dc /tmp/gta.tar.xz > /tmp/gta.tar
          tar -xf /tmp/gta.tar
          rm -rf .payload
          git config user.name 'SamAlpha1'
          git config user.email 'actions@users.noreply.github.com'
          git add pages .github/workflows/pages.yml .payload
          git commit -m 'Add bilingual GitHub Trust Auditor web app'
          git push
