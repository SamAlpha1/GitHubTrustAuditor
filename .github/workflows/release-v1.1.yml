name: Publish stable v1.1.1 tags

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v1.1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Point v1.1.1 and v1 to tested commit
        shell: bash
        env:
          TARGET_SHA: 98a05511e0cf74d628ffe48b447a77f21c73f059
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_SHA"
          git cat-file -e "$TARGET_SHA^{commit}"
          git config user.name "SamAlpha1"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v1.1.1 "$TARGET_SHA"
          git tag -f v1 "$TARGET_SHA"
          git push origin refs/tags/v1.1.1 --force
          git push origin refs/tags/v1 --force
