name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest pyyaml
      - name: Validate YAML manifests and workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = sorted(Path(".").rglob("*.yml")) + sorted(Path(".").rglob("*.yaml"))
          for path in files:
              yaml.safe_load(path.read_text(encoding="utf-8"))
          print(f"Validated {len(files)} YAML files")
          PY
      - run: python -m compileall -q auditor.py web_server.py trust_auditor
      - run: python -m pytest -q
      - run: python auditor.py --help
      - run: python web_server.py --help
