name: GitHub Trust Auditor
description: Defensive static security and trust audit for a GitHub account or repository without executing target code.
author: SamAlpha1
branding:
  icon: shield
  color: blue

inputs:
  username:
    description: GitHub username or owner/repository target to audit
    required: true
  github-token:
    description: Optional read-only GitHub token for higher API limits
    required: false
    default: ''
  ref:
    description: Optional branch, tag, or commit SHA for repository-only scans
    required: false
    default: ''
  max-files:
    description: Maximum candidate text files scanned per repository
    required: false
    default: '350'
  max-file-size:
    description: Maximum text blob size in bytes
    required: false
    default: '1000000'

outputs:
  report-json:
    description: Path to the generated JSON report
    value: ${{ steps.audit.outputs.report-json }}
  report-html:
    description: Path to the generated HTML report
    value: ${{ steps.audit.outputs.report-html }}
  exit-code:
    description: Auditor exit code (0 clean/complete, 1 partial/error, 2 critical)
    value: ${{ steps.audit.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install GitHub Trust Auditor
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check -r "${{ github.action_path }}/requirements.txt"

    - name: Audit GitHub account
      id: audit
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ACTION_PATH: ${{ github.action_path }}
        AUDIT_TARGET: ${{ inputs.username }}
        AUDIT_REF: ${{ inputs.ref }}
        AUDIT_MAX_FILES: ${{ inputs.max-files }}
        AUDIT_MAX_FILE_SIZE: ${{ inputs.max-file-size }}
      run: |
        set +e
        REF_ARGS=()
        if [ -n "$AUDIT_REF" ]; then
          REF_ARGS=(--ref "$AUDIT_REF")
        fi
        python "$ACTION_PATH/auditor.py" "$AUDIT_TARGET" \
          --max-files "$AUDIT_MAX_FILES" \
          --max-file-size "$AUDIT_MAX_FILE_SIZE" \
          "${REF_ARGS[@]}" \
          --json "$GITHUB_WORKSPACE/github-trust-audit.json" \
          --html "$GITHUB_WORKSPACE/github-trust-audit.html" \
          --quiet
        code=$?
        set -e

        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "report-json=$GITHUB_WORKSPACE/github-trust-audit.json" >> "$GITHUB_OUTPUT"
        echo "report-html=$GITHUB_WORKSPACE/github-trust-audit.html" >> "$GITHUB_OUTPUT"

        if [ "$code" -eq 2 ]; then
          echo "::error::GitHub Trust Auditor detected critical security findings."
          exit 2
        fi

        if [ "$code" -eq 1 ]; then
          if [ -s "${{ github.workspace }}/github-trust-audit.json" ]; then
            echo "::warning::Audit completed with partial coverage. Review the generated report."
          else
            echo "::error::Audit could not produce a report."
            exit 1
          fi
        fi
